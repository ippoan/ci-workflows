name: Gitleaks

# Reusable workflow: 秘密情報の混入チェック (全履歴スキャン)。
# gitleaks-action は org 利用でライセンスキーが要るため、公式 release の
# バイナリ (バージョン固定 + sha256 検証) を直接実行する。
#
# Usage (caller .github/workflows/ci.yml):
#
#   permissions:
#     contents: read
#   jobs:
#     gitleaks:
#       uses: ippoan/ci-workflows/.github/workflows/gitleaks.yml@main
#       with:
#         config_path: .gitleaks.toml    # optional (省略時は repo 直下の .gitleaks.toml、無ければ既定ルール)

on:
  workflow_call:
    inputs:
      config_path:
        description: 'gitleaks config (repo-relative). 存在しなければ既定ルールのみ'
        type: string
        default: '.gitleaks.toml'
      version:
        description: 'gitleaks version (without v)'
        type: string
        default: '8.30.1'
      runs_on:
        description: 'runner label'
        type: string
        default: 'ubuntu-latest'

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ inputs.runs_on }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "${base}/${tarball}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan full history
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          set -euo pipefail
          args=(git . --redact=100 --no-banner --exit-code 1)
          if [ -n "$CONFIG_PATH" ] && [ -f "$CONFIG_PATH" ]; then
            args+=(-c "$CONFIG_PATH")
          fi
          gitleaks "${args[@]}"
