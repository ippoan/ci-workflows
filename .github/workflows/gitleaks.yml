name: Gitleaks

# Reusable workflow: 秘密情報の混入チェック (全履歴スキャン)。
# gitleaks-action は org 利用でライセンスキーが要るため、公式 release の
# バイナリ (バージョン固定 + sha256 検証) を直接実行する。
#
# Usage (caller .github/workflows/ci.yml):
#
#   permissions:
#     contents: read
#   jobs:
#     gitleaks:
#       uses: ippoan/ci-workflows/.github/workflows/gitleaks.yml@main
#       with:
#         config_path: .gitleaks.toml    # optional (省略時は ci-workflows の config/gitleaks.toml)
#
# PR で足された commit 範囲の検査は auto-merge.yml が既定で行う (caller 不要)。
# こちらは全履歴を見たいとき用 (定期実行・履歴を書き換えた後の確認)。

on:
  workflow_call:
    inputs:
      config_path:
        description: 'repo 側の gitleaks config (repo-relative)。空なら ippoan/ci-workflows の config/gitleaks.toml'
        type: string
        default: ''
      runs_on:
        description: 'runner label'
        type: string
        default: 'ubuntu-latest'

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ inputs.runs_on }}
    env:
      # 版と中身を両方固定する。上げるときは 2 行とも変える。auto-merge.yml も同じ値。
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout shared gitleaks config
        if: ${{ inputs.config_path == '' }}
        uses: actions/checkout@v4
        with:
          repository: ippoan/ci-workflows
          path: _ci-workflows
          sparse-checkout: |
            config/gitleaks.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full history
        env:
          CONFIG_PATH: ${{ inputs.config_path || '_ci-workflows/config/gitleaks.toml' }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git . -c "$CONFIG_PATH" --redact=100 --no-banner --exit-code 1
