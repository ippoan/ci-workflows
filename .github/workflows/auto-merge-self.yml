name: Auto Merge (self)

# Dogfood: ci-workflows uses its own auto-merge reusable so PRs that pass
# CI (actionlint) merge without manual intervention, matching the policy
# we ship to consumer repos. The filename is `auto-merge-self.yml` to
# avoid colliding with the reusable `auto-merge.yml` in this same
# directory.
#
# Repo settings prerequisite (set once in Settings → General):
#   - Allow auto-merge: ON
#
# Flow:
#   1. PR opens / synchronizes / readied for review.
#   2. This caller invokes ippoan/ci-workflows/.github/workflows/auto-merge.yml
#      which runs `gh pr merge --squash` (with mergeability pre-check).
#   3. GitHub queues the squash merge; it executes once required checks
#      (actionlint) pass.

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  # 一時的: @main の auto-merge.yml が `actions: write` を要求する状態
  # (PR #55 merged) になっているため、それを caller (本 file) でも宣言
  # しないと parse 時 invalid になる。PR #56 (revert) merge 後は requirement
  # が消えるが、本 declare は extra permission として残しても害なし。
  actions: write

jobs:
  auto-merge:
    # `@main` ではなく PR 自身の版を呼ぶ: auto-merge.yml を変える PR が、
    # merge 前に自分自身の run で新しい版を通す (= 全 repo へ出る前の canary)。
    # `@main` だと PR の run は旧版で通ってしまい、新しい版が初めて動くのが
    # merge 後の全 repo の PR になる。gitleaks の設定も PR の版を読ませる。
    uses: ./.github/workflows/auto-merge.yml
    with:
      gitleaks_config_ref: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    secrets: inherit
